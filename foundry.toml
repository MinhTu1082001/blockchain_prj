[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./out-experiments" }, { access = "read-write", path = "./deployments" }]
gas_reports = ["Token", "Exchange", "Ledger"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
